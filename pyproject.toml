[project]
name = "mamacareai-pt26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jackson Matongo", email = "jacksonmatongo827@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "huggingface-hub>=1.29.0",
    "pydantic-settings>=2.0.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.16.1",
]

[project.scripts]
mamacareai-pt26 = "mamacareai_pt26:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
