[project]
name = "mamacareai-pt26"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jackson Matongo", email = "jacksonmatongo827@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.100",
    "chardet>=7.6.0",
    "chromadb>=1.5.9",
    "fastapi[standard]>=0.141.1",
    "google-generativeai>=0.8.6",
    "httpx>=0.28.1",
    "huggingface-hub>=1.29.0",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.0.0",
    "pymupdf>=1.28.2",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.3",
    "python-telegram-bot>=22.8",
    "ruff>=0.16.3",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "sqlalchemy>=2.0.54",
    "torch>=2.13.0",
    "trafilatura>=2.2.0",
    "transformers>=5.16.1",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
mamacareai-pt26 = "mamacareai_pt26:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
